<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RotaSegura</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif}
#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;top:12px;left:12px;right:12px;max-width:620px;margin:auto;background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 24px #0003}
.title{font-weight:800;font-size:19px;margin-bottom:8px}.sub{font-size:12px;color:#667085;margin-bottom:8px}
.row{display:flex;gap:7px}.input{flex:1;border:1px solid #d0d5dd;border-radius:10px;padding:12px;font-size:15px}
.btn{border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;padding:0 16px}
.results{margin-top:9px;font-size:13px}.routebox{background:#f7f8fa;border-radius:10px;padding:9px;margin-top:7px}
.safe{color:#087443;font-weight:700}.night{position:absolute;z-index:1000;right:14px;bottom:22px;border:0;border-radius:50%;width:48px;height:48px;background:#111;color:#fff;font-size:19px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<div class="title">🛡️ RotaSegura</div>
<div class="sub">Mapa real · teste de busca e rota</div>
<div class="row">
<input id="destino" class="input" placeholder="Digite o destino, ex.: Praça da Sé, São Paulo">
<button id="buscar" class="btn">Ir</button>
</div>
<div id="resultado" class="results">Obtendo localização...</div>
</div>
<button id="night" class="night">☾</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([-23.5505,-46.6333],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let userPos=null,userMarker=null,destMarker=null,routeLayers=[];
function result(t){document.getElementById('resultado').innerHTML=t}
function locate(){
 if(!navigator.geolocation){result('Localização indisponível. Digite um destino para testar.');return}
 navigator.geolocation.getCurrentPosition(p=>{
  userPos=[p.coords.latitude,p.coords.longitude];
  userMarker=L.circleMarker(userPos,{radius:8,color:'#fff',weight:3,fillColor:'#1769ff',fillOpacity:1}).addTo(map);
  map.setView(userPos,14); result('Localização encontrada. Digite um destino.');
 },()=>result('Localização não autorizada. Digite um destino para testar.'),{enableHighAccuracy:true,timeout:10000});
}
async function geocode(q){
 const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&q='+encodeURIComponent(q);
 const r=await fetch(u,{headers:{'Accept-Language':'pt-BR'}});
 const a=await r.json(); if(!a.length)throw Error('Endereço não encontrado');
 return [Number(a[0].lat),Number(a[0].lon),a[0].display_name];
}
async function route(a,b){
 const u=`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson&alternatives=true`;
 const r=await fetch(u); const d=await r.json();
 if(d.code!=='Ok'||!d.routes.length)throw Error('Não foi possível calcular a rota');
 return d.routes;
}
async function go(){
 const q=document.getElementById('destino').value.trim();
 if(!q)return result('Digite um destino.');
 const btn=document.getElementById('buscar');btn.disabled=true;result('🔎 Procurando endereço...');
 try{
  const d=await geocode(q), origin=userPos||[-23.5505,-46.6333];
  if(destMarker)map.removeLayer(destMarker);
  routeLayers.forEach(x=>map.removeLayer(x));routeLayers=[];
  destMarker=L.marker([d[0],d[1]]).addTo(map).bindPopup(d[2]).openPopup();
  result('🗺️ Encontrado. Calculando rota...');
  const rs=await route(origin,[d[0],d[1]]), all=[];
  rs.forEach((r,i)=>{
   const ll=r.geometry.coordinates.map(c=>[c[1],c[0]]);all.push(...ll);
   routeLayers.push(L.polyline(ll,{color:i?'#777':'#1769ff',weight:i?5:7,opacity:i?.65:.9,dashArray:i?'8 8':null}).addTo(map));
  });
  map.fitBounds(L.latLngBounds(all),{padding:[80,80]});
  const r=rs[0];
  result(`<div class="routebox"><b>Rota principal</b><br>⏱️ ${Math.round(r.duration/60)} min · 📏 ${(r.distance/1000).toFixed(1)} km<br><span class="safe">🛡️ Camada de segurança será adicionada depois.</span></div>`+(rs.length>1?`<div class="routebox">🔄 ${rs.length-1} alternativa(s).</div>`:''));
 }catch(e){result('⚠️ '+e.message)}finally{btn.disabled=false}
}
document.getElementById('buscar').onclick=go;
document.getElementById('destino').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
document.getElementById('night').onclick=()=>alert('Modo noturno será integrado na próxima versão.');
locate();
</script>
</body>
</html>
